[package]
name = "makelint"
version = "0.1.0"
edition = "2021"
description = "Lints a Makefile for missing .PHONY declarations, space-indented recipe lines, and references to undefined variables"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/makelint"
readme = "README.md"
keywords = ["makefile", "make", "lint", "cli", "build"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "makelint"
path = "src/lib.rs"

[[bin]]
name = "makelint"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
